<!doctype html><html><head><meta charset="utf-8"><title>Wild Card hint cards v2</title>
<style>
body{margin:0;font:12px/1.3 system-ui;background:#fff;color:#111}
.row{display:flex;gap:24px;align-items:flex-start;padding:12px;flex-wrap:wrap}
.lime{background:#b2e813;position:relative;overflow:hidden}
.g{position:absolute}
.g img{position:absolute;filter:drop-shadow(0 4px 6px rgb(40 50 0 / .28))}
.phone{width:390px;height:150px}
.laptop{width:520px;height:200px}
.big img{width:184px;filter:drop-shadow(0 4px 6px rgb(40 50 0 / .28))}
p{margin:4px 0}
</style></head><body>
<div class="row"><div>
<p>Phone (390 wide): card 42 x 58, group left 358, top 14; ace -14deg, king at left 42% top 9% rotate 9deg; half off the right edge</p>
<div class="lime phone"><div class="g" style="left:358px;top:14px;width:42px;height:58px">
<img src="../../hd/wild-card/st-card-ace-spades.svg" style="width:42px;left:0;top:0;transform:rotate(-14deg)">
<img src="../../hd/wild-card/st-card-king-hearts.svg" style="width:42px;left:42%;top:9%;transform:rotate(9deg)">
</div></div></div>
<div><p>Laptop: card 80 wide; group left -0.22 x 80; ace 16deg, king at left 52% top 26% rotate 28deg</p>
<div class="lime laptop"><div class="g" style="left:-17.6px;top:30px;width:80px;height:111px">
<img src="../../hd/wild-card/st-card-ace-spades.svg" style="width:80px;left:0;top:0;transform:rotate(16deg)">
<img src="../../hd/wild-card/st-card-king-hearts.svg" style="width:80px;left:52%;top:26%;transform:rotate(28deg)">
</div></div></div></div>
<div class="row lime big">
<img src="../../hd/wild-card/st-card-ace-spades.svg">
<img src="../../hd/wild-card/st-card-king-hearts.svg">
<img src="../../hd/wild-card/alt/st-card-king-hearts-plain.svg">
<div style="display:flex;gap:10px;align-items:flex-start">
<img src="../../hd/wild-card/st-card-ace-spades.svg" style="width:42px">
<img src="../../hd/wild-card/st-card-king-hearts.svg" style="width:42px">
<img src="../../hd/wild-card/alt/st-card-king-hearts-plain.svg" style="width:42px">
<img src="../../hd/wild-card/st-card-ace-spades.svg" style="width:90px">
<img src="../../hd/wild-card/st-card-king-hearts.svg" style="width:90px">
</div></div>
</body></html>
